<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zentariq Solutions is building something new. Our new digital experience is currently under development.">
    <title>Zentariq Solutions | Work in Progress</title>
    <link rel="icon" type="image/png" href="site-files/zentariq-logo.png">
    <style>
        :root {
            --bg: #040507;
            --border: rgba(255, 255, 255, 0.16);
            --text: #f5f3ee;
            --text-soft: rgba(245, 243, 238, 0.72);
            --text-faint: rgba(245, 243, 238, 0.5);
            --accent: #f59f51;
            --accent-strong: #ff7d1f;
            --transition: 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            line-height: 1.5;
            display: flex;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(245, 159, 81, 0.16) 0, transparent 30%),
                radial-gradient(circle at 90% 20%, rgba(173, 216, 255, 0.08) 0, transparent 28%),
                linear-gradient(135deg, rgba(255,255,255,0.02), transparent 50%);
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 88px 88px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
            opacity: 0.28;
            pointer-events: none;
            z-index: -1;
            animation: drift 28s linear infinite;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .cursor-glow {
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 159, 81, 0.16), transparent 72%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .wip-frame {
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto 1fr auto;
            width: min(100%, 1440px);
            margin: 0 auto;
            padding: clamp(22px, 3vw, 36px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 36px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
            overflow: hidden;
            isolation: isolate;
        }

        .wip-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at top left, rgba(245, 159, 81, 0.14), transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        .wip-frame::after {
            content: "";
            position: absolute;
            width: 60vw;
            height: 60vw;
            bottom: -30vw;
            right: -20vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,159,81,.12), rgba(148,113,218,.06) 32%, transparent 68%);
            filter: blur(12px);
            pointer-events: none;
            z-index: -1;
            animation: heroMesh 18s ease-in-out infinite alternate;
        }

        .wip-header {
            display: flex;
            justify-content: center;
        }

        .brand {
            display: inline-flex;
            max-width: 100%;
            align-items: center;
            gap: 14px;
            color: var(--text-soft);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .brand img {
            width: 444px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .wip-content {
            align-self: center;
            justify-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 760px;
            padding: 56px 0;
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.75s cubic-bezier(.16,1,.3,1), transform 0.75s cubic-bezier(.16,1,.3,1);
        }

        body.is-ready .reveal {
            opacity: 1;
            transform: none;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 26px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(245,243,238,.78);
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition-delay: 300ms;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1.8s ease-in-out infinite;
        }

        .wip-title {
            font-size: clamp(2.7rem, 7vw, 5.6rem);
            line-height: 0.95;
            letter-spacing: -0.055em;
            margin-bottom: 24px;
        }

        .wip-title .title-line {
            display: block;
            overflow: hidden;
            padding-bottom: 0.04em;
        }

        .wip-title .title-line span {
            display: block;
            transform: translateY(110%);
            transition: transform .85s cubic-bezier(.16,1,.3,1);
            transition-delay: 500ms;
        }

        .wip-title .title-line:nth-child(2) span {
            transition-delay: 630ms;
            background: linear-gradient(115deg, #f7bc7d, #ef7e34);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        body.is-ready .wip-title .title-line span {
            transform: translateY(0);
        }

        .wip-copy {
            color: var(--text-soft);
            font-size: clamp(1rem, 1.3vw, 1.12rem);
            line-height: 1.65;
            max-width: 38ch;
            margin-bottom: 26px;
            transition-delay: 950ms;
        }

        .pillars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 14px;
            margin-bottom: 36px;
            color: var(--text);
            font-size: 0.86rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition-delay: 1150ms;
        }

        .pillars i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px rgba(245, 159, 81, 0.6);
        }

        .wip-actions {
            transition-delay: 1350ms;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 250ms ease, box-shadow 250ms ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,.22);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .btn-primary {
            background: linear-gradient(115deg, #f7bc7d, #ef7e34);
            color: #100c07;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(245, 159, 81, 0.22);
        }

        .btn-arrow {
            display: inline-flex;
            transition: transform 250ms ease;
        }

        .btn:hover .btn-arrow {
            transform: translateX(4px);
        }

        .wip-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: var(--text-faint);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            transition-delay: 1550ms;
        }

        @media (max-width: 720px) {
            body {
                padding: 12px;
            }

            .wip-frame {
                border-radius: 24px;
            }

            .brand {
                font-size: 0.64rem;
            }

            .brand img {
                width: 360px;
            }

            .wip-content {
                padding: 48px 0;
            }

            .wip-title {
                font-size: clamp(2.3rem, 11vw, 3.4rem);
            }

            .wip-footer {
                font-size: 0.7rem;
                letter-spacing: 0.14em;
            }
        }

        @media (max-width: 420px) {
            .btn {
                width: 100%;
            }

            .wip-actions {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to { transform: translateY(-40px); }
        }

        @keyframes heroMesh {
            to { transform: translate3d(-3vw, -5vw, 0) scale(1.08); }
        }

        @keyframes blink {
            50% { opacity: 0.35; }
        }
    </style>
</head>
<body>
    <div class="cursor-glow" aria-hidden="true"></div>

    <div class="wip-frame">
        <header class="wip-header">
            <a class="brand" href="/" aria-label="Zentariq Solutions home">
                <img src="site-files/zentariq-logo.png" alt="Zentariq">
            </a>
        </header>

        <main class="wip-content">
            <div class="status-pill reveal"><span class="live-dot" aria-hidden="true"></span>Work in progress</div>
            <h1 class="wip-title">
                <span class="title-line"><span>We're building</span></span>
                <span class="title-line"><span>something new.</span></span>
            </h1>
            <p class="wip-copy reveal">Our new digital experience is currently under development.</p>
            <div class="pillars reveal" aria-label="Strategy, Technology, Growth">
                <span>Strategy</span><i aria-hidden="true"></i><span>Technology</span><i aria-hidden="true"></i><span>Growth</span>
            </div>
            <div class="wip-actions reveal">
                <a class="btn btn-primary" href="mailto:hello@zentariq.com">
                    Let's Talk <span class="btn-arrow">→</span>
                </a>
            </div>
        </main>

        <footer class="wip-footer reveal">
            Build smart. Scale fast. Win big.
        </footer>
    </div>

    <script>
        const glow = document.querySelector('.cursor-glow');

        document.addEventListener('mousemove', (event) => {
            glow.style.left = `${event.clientX}px`;
            glow.style.top = `${event.clientY}px`;
            glow.style.opacity = '1';
        });

        document.addEventListener('mouseleave', () => {
            glow.style.opacity = '0';
        });

        window.addEventListener('load', () => {
            setTimeout(() => document.body.classList.add('is-ready'), 150);
        });
    </script>
</body>
</html>
